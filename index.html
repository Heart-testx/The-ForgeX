<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Rune Midgard Ranch</title>
<style>
/* ===== UI: RO classic blue-cream glass windows ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:#1d2b4a;font-family:Tahoma,"Noto Sans Thai",sans-serif;color:#2b3b5e;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:6px}
.win{background:linear-gradient(#fdf8e4,#e9ecf7);border:2px solid #3d5a99;border-radius:6px;box-shadow:inset 0 0 0 2px #fff,0 2px 6px #0006;padding:5px 7px}
#top{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:13px;font-weight:bold;margin-bottom:5px}
.bar{height:11px;background:#9aa7c7;border:1px solid #3d5a99;border-radius:3px;overflow:hidden;margin:2px 0}
.bar i{display:block;height:100%;width:0}
#expb{background:linear-gradient(#ffe36a,#e5a800)}#enb{background:linear-gradient(#6fe08a,#1f9a45)}
canvas{width:100%;display:block;border:3px solid #3d5a99;border-radius:6px;background:#5fb04a;touch-action:none;image-rendering:pixelated}
#tools,#menu,#menu2{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
button,select{touch-action:manipulation;transition:filter .08s;font:bold 13px Tahoma,sans-serif;color:#2b3b5e;background:linear-gradient(#fff,#cfd8ef);border:2px solid #3d5a99;border-radius:5px;padding:7px 8px;flex:1;cursor:pointer}
button.on{background:linear-gradient(#ffe98a,#f0b429);border-color:#8a5a00}
button:active{filter:brightness(.9)}button:disabled{opacity:.5}
#msg{height:18px;font-size:12px;text-align:center;margin-top:4px;color:#dfe8ff}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9}
#modal .win{width:min(420px,94vw);max-height:84vh;overflow:auto;padding:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 0;border-bottom:1px dashed #9aa7c7;font-size:14px}
.row button{flex:none;padding:4px 10px}h3{margin:0 0 6px;text-align:center}
/* [PATCH 1.1] buff chips + new menu row */
#buffs{min-height:24px;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:3px}
.chip{background:linear-gradient(#fff,#cfd8ef);border:2px solid #3d5a99;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:bold}
</style>
</head>
<body>
<div id="app">
  <div id="top" class="win">
    <span id="lv">Lv 1</span>
    <div><div class="bar"><i id="expb"></i></div><div class="bar"><i id="enb"></i></div></div>
    <span id="zeny">0z</span>
  </div>
  <canvas id="c" width="480" height="480"></canvas>
  <div id="msg"></div>
  <div id="buffs"></div><!-- [PATCH 1.1] active buff timers -->
  <div id="tools" class="win">
    <button data-t="hoe">⛏ Hoe</button><button data-t="plant">🌱 Plant</button>
    <button data-t="water">💧 Water</button><button data-t="harvest">🧺 Harvest</button><button data-t="fert" id="bFert">🧪 Fert</button><!-- [PATCH 1.1] fertilizer tool -->
    <select id="seed"></select>
  </div>
  <div id="menu">
    <button id="bBag">🎒 Inventory</button><button id="bShop">🏪 Kafra Shop</button><button id="bStat">📊 Stats</button><button id="bDecor">🏡 Decor</button><button id="bSeason">📅 Season</button><button id="bGacha">🎰 Gacha</button>
  </div>
  <!-- [PATCH 1.1] new menu row: Expand Farm / Quests / Craft -->
  <div id="menu2"><button id="bExpand">🌾 Expand Farm</button><button id="bQuest">📜 Quests</button><button id="bCraft">⚗ Craft</button><button id="bBarn">🐔 Barn</button></div>
</div>
<div id="modal"><div class="win" id="mbox"></div></div>

<script>
"use strict";
/* ===== MODULE: Config & Data ===== */
const W=480,OX=48,OY=72,FS=384; // FS = fixed fenced farm area in px (tile size is derived from the grid size)
/* [PATCH 1.1] GRID EXPANSION CONFIG ------------------------------------------------------------
   start = size of a brand-new farm. ups = upgrade ladder (size you upgrade TO, player level needed, Zeny cost).
   To add 7x7 / 8x8 just append a line - rendering, input, monsters, quests and achievements adapt automatically.
   (Works up to ~12x12 before tiles get too small to tap.) */
const GRID={start:4,ups:[
 {size:5,lv:5, cost:1500},
 {size:6,lv:10,cost:5000},
 // {size:7,lv:16,cost:15000},
 // {size:8,lv:22,cost:40000},
]};
let N=GRID.start,T=FS/GRID.start;                 // N = tiles per side, T = tile size in px (both change on expand)
const setGrid=n=>{N=n;T=FS/n};
const tcx=i=>OX+(i%N)*T+T/2, tcy=i=>OY+(i/N|0)*T+T/2; // pixel centre of tile index i
const CROPS=[ // t = seconds to full growth
 {n:"Poring Seed",   t:15, sell:30,  cost:10,  exp:8,  c:"#ff9bb3"},
 {n:"Red Herb",      t:30, sell:70,  cost:35,  exp:15, c:"#e0243a"},
 {n:"Yellow Herb",   t:50, sell:130, cost:70,  exp:25, c:"#f5d423"},
 {n:"Apple Tree",    t:80, sell:250, cost:150, exp:45, c:"#d93a2b"},
 {n:"Yggdrasil Berry",t:160,sell:800,cost:500, exp:120,c:"#a45cff"},
 {n:"Blue Herb",t:65,sell:190,cost:105,exp:35,c:"#3a7bff",lv:6},
 {n:"Mastela Fruit",t:120,sell:450,cost:260,exp:70,c:"#ff8c1a",lv:12}];
const DROPS={jelopy:{n:"Jelopy",sell:8,d:"วัตถุดิบสำหรับ Craft / Cook หลายสูตร • ขาย 8z"},clover:{n:"Clover",sell:50,d:"ใบโคลเวอร์ ใช้ทำ Lucky Tea ได้ • ขาย 50z"},apple:{n:"Apple",sell:20,heal:30,d:"ฟื้น Energy +30 • ใช้ทำ Herbal Stew ได้ • ขาย 20z"},potion:{n:"Red Potion",sell:0,heal:50,d:"ฟื้น Energy +50"},
 coin:{n:"Gacha Coin",sell:0,d:"ใช้หมุนที่ Gachapon"},
 sprinkler:{n:"Sprinkler Scroll",sell:0,fx:1,d:"รดน้ำพืชทุกต้นทันที"},
 elixir:{n:"Growth Elixir",sell:0,fx:1,d:"พืชทุกต้นโตเพิ่ม 40%"},
 golden:{n:"Golden Fertilizer",sell:0,fx:1,d:"ปลูก 5 ต้นถัดไปเป็น Golden ขึ้นไป (Rainbow 15%)"},
 scare:{n:"Scarecrow Charm",sell:0,fx:1,d:"ไล่มอนสเตอร์ 60 วินาที"},
 tiller:{n:"Auto-Tiller Scroll",sell:0,fx:1,d:"พรวนดินทุกช่องที่ยังว่าง"},
 ygg_dew:{n:"Yggdrasil Dew",sell:0,fx:1,d:"เร่งพืชในแปลงทุกต้นให้โตเต็มวัย 100% ทันที"},
 /* [PATCH 1.1] crafted items. heal = restores Energy, buff = starts a timed buff (see BUFFS), fx = handled in FX */
 mpotion:{n:"Minor Potion",sell:0,heal:40,d:"ฟื้น Energy +40"},
 fert:{n:"Quick-Gro Fertilizer",sell:0,fx:1,d:"กดปุ่ม 🧪 Fert แล้วแตะแปลงที่กำลังโต: เวลาโตที่เหลือ -50%"},
 brew:{n:"Berserk Brew",sell:0,fx:1,buff:"power",d:"ดาเมจโจมตี +50% นาน 60 วินาที"},
 stew:{n:"Herbal Stew",sell:0,fx:1,buff:"feast",d:"EXP +30% นาน 90 วินาที"},
 gardener:{n:"Gardener Contract",sell:0,fx:1,d:"จ้างชาวสวน 1 คน ทำฟาร์มให้อัตโนมัติ 2 นาทีครึ่ง (พรวน→ปลูก→รดน้ำ→เก็บเกี่ยว) • จ้างพร้อมกันได้สูงสุด 5 คน แบ่งงานกันไม่ซ้ำแปลง • ใช้เมล็ดจาก Inventory"},
 golem:{n:"Golem Contract",sell:0,fx:1,d:"จ้างโกเลม 1 ตัว ตีมอนสเตอร์ให้อัตโนมัติ 2 นาทีครึ่ง • จ้างพร้อมกันได้สูงสุด 5 ตัว แบ่งเป้าหมายกัน • ไม่ใช้ Energy ได้ Zeny/EXP/ดรอปเหมือนผู้เล่นฆ่าเอง"},
 egg:{n:"Egg",sell:70,d:"จากไก่ • ใช้ทำอาหารได้"},
 wool:{n:"Wool",sell:180,d:"จากแกะ • ใช้คราฟต์ได้"},
 milk:{n:"Milk",sell:400,d:"จากวัว • ใช้ทำอาหารได้"},
 omelet:{n:"Herb Omelet",sell:0,heal:80,d:"ฟื้น Energy +80"},
 soup:{n:"Hearty Soup",sell:0,fx:1,buff:"hearty",d:"EXP +50% นาน 120 วินาที"},
 scarf:{n:"Wool Scarf",sell:0,fx:1,buff:"cozy",d:"Energy ฟื้นเร็ว x2 นาน 120 วินาที"},
 tea:{n:"Lucky Tea",sell:0,fx:1,buff:"lucky",d:"โอกาสต้นทอง/รุ้ง x1.5 นาน 90 วินาที"}};
const MON={
 poring: {n:"Poring", hp:20,z:15,exp:10,d:[["jelopy",.6],["apple",.15]]},
 lunatic:{n:"Lunatic",hp:30,z:25,exp:16,d:[["clover",.3],["jelopy",.3]]},
 fabre:  {n:"Fabre",  hp:15,z:10,exp:7, d:[["jelopy",.4],["apple",.1]]}};
const CR={c:{p:"",m:1,e:1},g:{p:"✨Golden ",m:5,e:2},r:{p:"🌈Rainbow ",m:15,e:4}}; // crop rarity: prefix, sell multiplier, exp multiplier
const itemName=k=>k[1]=="_"?CR[k[0]].p+CROPS[+k.slice(2)].n.replace(" Seed",""):DROPS[k].n;
const itemSell=k=>k[1]=="_"?CROPS[+k.slice(2)].sell*CR[k[0]].m:DROPS[k].sell;

/* ===== [PATCH 1.9] Barn data =====
   ANIMALS: lv = level to buy, cost = base Zeny, feed = [[crop inventory key, qty]] per production cycle (normal-quality crops only),
   cycle = ms of "fed" time per product, out = DROPS key. BARN_TIERS: animal slots (cap) + level/Zeny needed to upgrade TO that tier. */
const ANIMALS={
 chicken:{n:"Chicken",ic:"🐔",lv:3, cost:600, feed:[["c_0",1]],cycle:45000, out:"egg"},
 sheep:  {n:"Sheep",  ic:"🐑",lv:8, cost:1800,feed:[["c_1",1]],cycle:70000, out:"wool"},
 cow:    {n:"Cow",    ic:"🐄",lv:12,cost:3500,feed:[["c_2",1]],cycle:100000,out:"milk"}};
const BARN_TIERS=[{cap:2},{cap:4,lv:6,cost:2000},{cap:6,lv:12,cost:6000},{cap:8,lv:18,cost:15000}];
const BARN_STORE=5, BARN_FEED_MAX=5;   // max products waiting in the barn / max feed charges per animal
const normBarn=b=>{b=b&&typeof b=="object"?b:{};const c=Number.isInteger(b.c)&&b.c>=0&&b.c<BARN_TIERS.length?b.c:0;
 return {c,a:(Array.isArray(b.a)?b.a:[]).filter(x=>x&&ANIMALS[x.k]).slice(0,BARN_TIERS[c].cap).map(x=>({k:x.k,p:Math.max(0,+x.p||0),f:Math.min(BARN_FEED_MAX,Math.max(0,x.f|0)),o:Math.min(BARN_STORE,Math.max(0,x.o|0))}))}};

/* ===== MODULE: Save / State ===== */
const fresh=()=>({z:200,exp:0,lv:1,pt:0,str:1,dex:1,luk:1,en:100,inv:{s_0:5},seed:0,
  gs:GRID.start, // [PATCH 1.1] grid size saved in state
  tiles:Array.from({length:GRID.start**2},()=>({st:0}))});
let S;try{S=JSON.parse(localStorage.getItem("rmr_save"))}catch(e){S=null}
/* [PATCH 1.4] an unreadable/invalid save is never silently overwritten: the raw text is kept in rmr_save_corrupt (Admin > Data can show it) */
if(!S||!Array.isArray(S.tiles)||!S.tiles.length||typeof S.z!="number"||typeof S.lv!="number"||!S.inv){try{const raw=localStorage.getItem("rmr_save");if(raw)localStorage.setItem("rmr_save_corrupt",raw)}catch(e){}S=fresh()}
S.tiles.forEach(t=>{if(t.shiny&&t.rar===undefined)t.rar=1}); // migrate old saves
S.dec=S.dec||{}; // owned decorations {key:1}
/* [PATCH 1.1] new state fields + migration for old saves
   gs = grid size (old saves had a fixed 6x6 = 36 tiles, so they keep their 6x6 farm), stats = lifetime counters,
   q = today's quests, ach = claimed achievement tiers, bf = active buffs {id:msLeft} */
S.gs=S.gs||Math.round(Math.sqrt(S.tiles.length))||GRID.start;setGrid(S.gs);
S.stats=Object.assign({h:0,hc:{},hg:0,hr:0,k:0,kc:{},cr:0,an:0},S.stats);S.barn=normBarn(S.barn); // [PATCH 1.9]
S.ach=S.ach||{};S.bf=S.bf||{};S.gl=(Array.isArray(S.gl)?S.gl:[]).filter(v=>Number.isFinite(v)&&v>0).slice(0,5); // [PATCH 1.8] time left (ms) of each hired golem, max 5
S.gd=(Array.isArray(S.gd)?S.gd:S.gd>0?[S.gd]:[]).filter(v=>Number.isFinite(v)&&v>0).slice(0,5); // [PATCH 1.7] time left (ms) of each hired gardener, max 5 (old single-number saves are converted)
const has=k=>S.dec[k]?1:0;
// Money sinks: shop prices inflate with level and owned decorations; Sell All is taxed; decorations cost upkeep each season
const TAX=.08;
const infl=()=>1+.04*(S.lv-1)+.03*Object.keys(S.dec).length;
const P=c=>Math.max(5,Math.round(c*infl()/5)*5);
let SAVE_LOCK=false; // [PATCH 1.4] true while the page is about to reload (admin import/restore/reset): nothing may overwrite the save then
/* [PATCH 1.5] save() is now debounced: many taps in a row = ONE JSON.stringify + localStorage write (was one per tap).
   saveNow() writes immediately and is used when the page is hidden/closed. */
let saveTm=0;
const saveNow=()=>{if(saveTm){clearTimeout(saveTm);saveTm=0}if(SAVE_LOCK)return;try{localStorage.setItem("rmr_save",JSON.stringify(S))}catch(e){}};
const save=()=>{if(SAVE_LOCK||saveTm)return;saveTm=setTimeout(saveNow,350)};
setInterval(saveNow,4000);addEventListener("beforeunload",saveNow);
const maxEn=()=>100+(S.lv-1)*5+has("chimney")*10, needExp=()=>30+S.lv*25;
const add=(k,n=1)=>{S.inv[k]=(S.inv[k]||0)+n;if(S.inv[k]<=0)delete S.inv[k]};

/* ===== MODULE: Audio (Web Audio 8-bit synth) ===== */
let AC;
function beep(f,d=.1,type="square",to=0,delay=0,vol=.07){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const SFX={
 hoe:()=>{beep(120,.12,"sawtooth",60);beep(200,.05,"square",0,.04)},
 plant:()=>beep(500,.1,"triangle",800),
 water:()=>{beep(900,.08,"sine",400);beep(700,.08,"sine",300,.07)},
 harvest:()=>{beep(660,.08);beep(880,.08,"square",0,.08);beep(1100,.12,"square",0,.16)},
 hit:()=>{beep(300,.1,"sawtooth",80);beep(90,.1,"square",0,.03)},
 kill:()=>{beep(440,.1);beep(330,.1,"square",0,.1);beep(220,.18,"square",0,.2)},
 coin:()=>{beep(1200,.06);beep(1600,.1,"square",0,.06)},
 bad:()=>beep(150,.2,"sawtooth",90),
 lvl:()=>[523,659,784,1047,1319].forEach((f,i)=>beep(f,.15,"square",0,i*.09))};

/* ===== MODULE: UI helpers ===== */
const $=id=>document.getElementById(id);
let tool="hoe",msgT=0;
function say(t){$("msg").textContent=t;msgT=3000}
const setSty=(id,w)=>{const e=$(id);if(e.style.width!==w)e.style.width=w};
function ui(){
  /* [PATCH 1.5] cached DOM writes */
  setTxt("lv","Lv "+S.lv);setTxt("zeny",S.z+"z");setTxt("bGacha","🎰 Gacha ("+(S.inv.coin||0)+")");
  setSty("expb",(S.exp/needExp()*100).toFixed(1)+"%");setSty("enb",(S.en/maxEn()*100).toFixed(1)+"%");
  const tt="EXP "+S.exp+"/"+needExp()+"  Energy "+Math.floor(S.en)+"/"+maxEn();if($("top").title!==tt)$("top").title=tt;
  hud(); // [PATCH 1.1] expand/quest/fert labels + buff chips
}
function refreshSeeds(){
  const sel=$("seed");sel.innerHTML="";
  CROPS.map((c,i)=>({c,i})).sort((a,b)=>a.c.t-b.c.t).forEach(({c,i})=>{const o=document.createElement("option");o.value=i;o.textContent=c.n+" x"+(S.inv["s_"+i]||0);sel.appendChild(o)});
  sel.value=S.seed;
}
$("seed").onchange=e=>{S.seed=+e.target.value;tool="plant";markTool()};
function markTool(){document.querySelectorAll("#tools button").forEach(b=>b.classList.toggle("on",b.dataset.t==tool))}
document.querySelectorAll("#tools button").forEach(b=>b.onclick=()=>{tool=b.dataset.t;markTool()});

/* ===== MODULE: Progression ===== */
const floats=[];
const flo=(x,y,t,c="#fff")=>floats.push({x,y,t,c,l:1200});
function gainExp(n,x,y){
  n=Math.round(n*SE().exp*(1+.05*has("flowerpot")+.10*has("flag")));S.exp+=n;flo(x,y-14,"+"+n+" EXP","#ffe36a");
  while(S.exp>=needExp()){S.exp-=needExp();S.lv++;S.pt+=3+has("attic");S.en=maxEn();SFX.lvl();flo(240,200,"LEVEL UP!","#7dffb0");say("Level Up! +"+(3+has("attic"))+" Stat Points")}
}
function useEn(n){n=Math.ceil(n*SE().cost);if(S.en<n){SFX.bad();say("Energy ไม่พอ! ใช้ Red Potion หรือรอฟื้นฟู");return false}S.en-=n;return true}

/* ===== MODULE: Farming ===== */
const need=k=>CROPS[k].t*1000;
const stageOf=t=>t.g>=need(t.k)?3:t.g>need(t.k)*.5?2:1;
/* Crop rarity roll: 0 Normal, 1 Golden (x5), 2 Rainbow (x15). LUK raises both chances. */
function rollRar(){
  if(S.gold>0){S.gold--;return Math.random()<.15?2:1} // Golden Fertilizer
  const r=Math.random(),k=SE().rare,pr=(.007+S.luk*.003)*k,pg=(.02+S.luk*.01)*k;return r<pr?2:r<pr+pg?1:0;
}
function useTool(i){
  const t=S.tiles[i],cx=tcx(i),cy=tcy(i); // [PATCH 1.1] dynamic grid helpers
  if(tool=="hoe"){
    if(t.st!=0)return say("ช่องนี้พรวนแล้ว");if(!useEn(2))return;
    t.st=1;SFX.hoe();flo(cx,cy,"พรวนดิน","#e8c28a");
  }else if(tool=="plant"){
    if(t.st!=1)return say(t.st==0?"ต้องพรวนดินก่อน":"มีพืชอยู่แล้ว");
    const k=S.seed;if(!S.inv["s_"+k])return say("ไม่มี "+CROPS[k].n+" ซื้อที่ Kafra Shop");
    if(!useEn(1))return;add("s_"+k,-1);Object.assign(t,{st:2,k,g:0,w:!!(has("well")&&Math.random()<.3),rar:rollRar(),f:0});
    SFX.plant();refreshSeeds();
  }else if(tool=="water"){
    if(t.st!=2)return say("ไม่มีพืชให้รดน้ำ");if(t.w)return say("รดน้ำแล้ว");
    if(!useEn(2))return;t.w=true;SFX.water();flo(cx,cy,"💧","#9cf");
  }else if(tool=="fert"){ // [PATCH 1.1] apply Quick-Gro Fertilizer: remaining growth time -50% (growth speed x2, see game loop)
    if(t.st!=2)return say("ไม่มีพืชให้ใส่ปุ๋ย");if(t.g>=need(t.k))return say("พืชโตเต็มที่แล้ว");if(t.f)return say("แปลงนี้ใส่ปุ๋ยแล้ว");
    if(!S.inv.fert)return say("ไม่มีปุ๋ย • คราฟต์ได้ที่เมนู Craft");
    add("fert",-1);t.f=1;SFX.plant();flo(cx,cy,"🧪 โต x2","#9dff7a");
  }else{
    if(t.st!=2)return;if(t.g<need(t.k))return say(t.w?"ยังไม่โต รอก่อน":"ต้องรดน้ำก่อนถึงจะโต");
    const n=1+(Math.random()<S.str*.04+SE().dbl?1:0),rr=t.rar||0,rk="cgr"[rr],c=CROPS[t.k];
    add(rk+"_"+t.k,n);track("harvest",{k:t.k,rar:rr,n}); /* [PATCH 1.1] stats + quests */const ex=Math.round(c.exp*CR[rk].e*n);
    flo(cx,cy,rr?(rr==2?"🌈RAINBOW!":"✨GOLDEN!"):"+"+n+(n>1?" DOUBLE!":""),rr==2?"#ff7bff":rr?"#ffd700":"#fff");
    gainExp(ex,cx,cy+14);SFX.harvest();t.st=1;delete t.k;delete t.f;
  }
  save();
}

/* ===== MODULE: Monsters ===== */
const mons=[];let spawnT=8000;
function spawn(fty,force){
  if((!force&&mons.length>=4)||S.scare>0)return;
  const ty=fty||["poring","lunatic","fabre"][Math.random()*3|0],side=Math.random()*4|0;
  const x=side==0?-10:side==1?W+10:Math.random()*W,y=side==2?-10:side==3?W+10:Math.random()*W;

    let b=-1,bd=1e9;S.tiles.forEach((t,i)=>{if(t.st==2){const d=Math.hypot(tcx(i)-m.x,tcy(i)-m.y);if(d<bd){bd=d;b=i}}});

/* ===== [PATCH 1.1] MODULE 1: Dynamic Grid Expansion =====
   Config (GRID, setGrid, tcx/tcy) is at the top of the file. State: S.gs (size) + S.tiles (flat array, row-major).
   Expanding re-maps every old tile to the same (row, col) in the bigger array, so planted crops are never lost. */
const nextGrid=()=>GRID.ups.find(u=>u.size>S.gs);                       // next upgrade or undefined when maxed
const canExpand=()=>{const u=nextGrid();return !!u&&S.lv>=u.lv&&S.z>=u.cost};
function expandFarm(){
  const u=nextGrid();if(!u)return;
  if(S.lv<u.lv||S.z<u.cost){SFX.bad();return}
  S.z-=u.cost;applyExpand(u);expandUI();
}
function applyExpand(u){ // shared by the player upgrade and the Admin panel (free expand)
  const o=S.gs,n=u.size,nt=Array.from({length:n*n},()=>({st:0}));
  S.tiles.forEach((t,i)=>{nt[(i/o|0)*n+i%o]=t});                        // keep existing plots at the same row/col
  S.tiles=nt;S.gs=n;setGrid(n);
  mons.forEach(m=>{m.tg=-1;m.eat=0});                                    // monster targets were old tile indices
  SFX.lvl();flo(240,210,"🌾 Farm "+n+"×"+n+"!","#7dffb0");say("🌾 ขยายฟาร์มเป็น "+n+"×"+n+" แล้ว!");save();
}
function expandUI(){
  const u=nextGrid(),c=S.gs,col=ok=>ok?"#1f7a3a":"#c0182b";
  let h=`<h3>🌾 Expand Farm</h3><div class="row"><b>Zeny: ${S.z.toLocaleString()}z</b><span>Lv ${S.lv}</span></div>
  <div class="row"><span>ขนาดฟาร์มตอนนี้</span><b>${c}×${c} (${c*c} แปลง)</b></div>`;
  if(!u)h+=`<div class="row"><b>🏆 ขยายฟาร์มสูงสุดแล้ว!</b></div>`;
  else{
    const lvOk=S.lv>=u.lv,zOk=S.z>=u.cost;
    h+=`<div class="row" style="display:block"><b>ถัดไป: ${u.size}×${u.size} (${u.size*u.size} แปลง)</b><br>
    <small style="color:${col(lvOk)}">เลเวล ${S.lv}/${u.lv}</small> • <small style="color:${col(zOk)}">Zeny ${S.z.toLocaleString()}/${u.cost.toLocaleString()}</small></div>
    <button style="width:100%;margin-top:6px" ${lvOk&&zOk?"":"disabled"} onclick="expandFarm()">${!lvOk?"🔒 ต้องถึง Lv "+u.lv:!zOk?"💰 Zeny ไม่พอ":"🌾 ขยายเป็น "+u.size+"×"+u.size+" ("+u.cost.toLocaleString()+"z)"}</button>`;
  }
  modal(h+`<div style="font-size:12px;text-align:center;margin-top:6px">พืชที่ปลูกอยู่จะไม่หาย • แปลงใหม่เป็นดินที่ยังไม่พรวน</div>`);
}

/* ===== [PATCH 1.1] MODULE 2: Buffs (timed effects from crafted items) =====
   S.bf = {buffId: msLeft}. m = multipliers merged into SE() by rebuildSE() -> applyBuffMods().
   Supported keys: dmg (attack damage), exp, rare (golden/rainbow chance), grow, sell, cost, regen. */
const BUFFS={
 power:{n:"Berserk",ic:"💪",dur:60000,m:{dmg:1.5}},
 feast:{n:"Herbal Feast",ic:"🍲",dur:90000,m:{exp:1.3}},
 lucky:{n:"Lucky Tea",ic:"🍀",dur:90000,m:{rare:1.5}},
 hearty:{n:"Hearty Soup",ic:"🥛",dur:120000,m:{exp:1.5}},
 cozy:{n:"Wool Scarf",ic:"🧣",dur:120000,m:{regen:2}}};
function applyBuffMods(){SEC.dmg=1;for(const id in S.bf){const b=BUFFS[id];if(!b){delete S.bf[id];continue}for(const k in b.m)SEC[k]=(SEC[k]||1)*b.m[k]}}
function startBuff(id){const b=BUFFS[id];S.bf[id]=b.dur;rebuildSE();flo(240,200,b.ic+" "+b.n+"!","#7dffb0");say(b.ic+" "+b.n+" นาน "+b.dur/1000+" วินาที");return true}
function tickBuffs(dt){let ch=0;for(const id in S.bf){if((S.bf[id]-=dt)<=0){const b=BUFFS[id];delete S.bf[id];ch=1;say((b?b.ic+" "+b.n:"Buff")+" หมดเวลา")}}if(ch)rebuildSE()}

FX.fert=()=>{tool="fert";markTool();closeM();say("🧪 แตะแปลงที่กำลังโตเพื่อใส่ปุ๋ย");return "tool"}; // "tool" = item is consumed when the tool is used
Object.keys(DROPS).forEach(k=>{if(DROPS[k].buff)FX[k]=()=>startBuff(DROPS[k].buff)});               // any DROPS entry with buff:"id" works

/* ===== [PATCH 1.1] MODULE 3: Stats + Daily Quests + Achievements =====
   S.stats  lifetime counters (updated by track()); S.q = {d:dayKey, rr:free rerolls, list:[3 quests]}
   quest = {type, tg, need, p:progress, cl:claimed, rw:[[itemKey|"z", qty],...]}   ("z" = Zeny)
   S.ach = {achievementId: number of tiers already claimed}                               */
const pick=a=>a[Math.random()*a.length|0], ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

const BONUS=[[["coin",1]],[["fert",1]],[["fert",2]],[["potion",2]],[["sprinkler",1]],[["mpotion",2]]]; // random extra reward
/* Quest templates. w = weight, ok() = availability gate, make() = returns {type,tg,need,rw}. Add your own here. */
const QUEST_POOL=[
 {w:5,make:()=>{const k=pick(unlockedCrops()),c=CROPS[k],n=Math.max(2,Math.min(12,Math.round(700/c.sell*(.8+Math.random()*.4))));
   return {type:"harvest",tg:k,need:n,rw:[["z",Math.round(n*c.sell*.5/10)*10],...pick(BONUS)]}}},
 {w:3,make:()=>{const n=ri(8,16);return {type:"harvestAny",tg:null,need:n,rw:[["z",n*25],...pick(BONUS)]}}},
 {w:4,make:()=>{const ty=pick(Object.keys(MON)),n=ri(3,8);return {type:"kill",tg:ty,need:n,rw:[["z",n*35],...pick(BONUS)]}}},
 {w:2,make:()=>{const n=ri(6,12);return {type:"killAny",tg:null,need:n,rw:[["z",n*30],...pick(BONUS)]}}},
 {w:2,ok:()=>S.lv>=3,make:()=>{const n=ri(1,3);return {type:"craft",tg:null,need:n,rw:[["z",n*120],...pick(BONUS)]}}},
 {w:2,ok:()=>S.barn.a.length>0,make:()=>{const n=ri(3,8);return {type:"barn",tg:null,need:n,rw:[["z",n*60],...pick(BONUS)]}}}, // collect animal products
 {w:1.5,ok:()=>S.lv>=4,make:()=>({type:"harvestRar",tg:1,need:1,rw:[["z",400],["coin",1]]})},                       // Golden or better
 {w:.7,ok:()=>S.lv>=8,make:()=>({type:"harvestRar",tg:2,need:1,rw:[["coin",2],["golden",1],["z",800]]})}];          // Rainbow
const qKey=q=>q.type+":"+q.tg;
const qValid=q=>!!q&&Number.isFinite(q.p)&&Number.isFinite(q.need)&&q.need>0&&Array.isArray(q.rw)&&q.rw.every(r=>r[0]=="z"||!!DROPS[r[0]])&&
 (q.type=="harvest"?!!CROPS[q.tg]:q.type=="kill"?!!MON[q.tg]:["harvestAny","harvestRar","killAny","craft","barn"].includes(q.type)); // [PATCH 1.4]
const qText=q=>({ // lazy functions: only the entry for q.type is evaluated
 harvest:()=>`เก็บเกี่ยว ${crn(q.tg)} ${q.need} ชิ้น`,

 kill:()=>`กำจัด ${MON[q.tg].n} ${q.need} ตัว`,
 killAny:()=>`กำจัดมอนสเตอร์ ${q.need} ตัว`,
 barn:()=>`เก็บผลผลิตจากคอกสัตว์ ${q.need} ชิ้น`,
 craft:()=>`คราฟต์ / ทำอาหาร ${q.need} ครั้ง`}[q.type])();
const qMatch=(q,ev,d)=>({harvest:ev=="harvest"&&d.k==q.tg,harvestAny:ev=="harvest",harvestRar:ev=="harvest"&&d.rar>=q.tg,
 kill:ev=="kill"&&d.ty==q.tg,killAny:ev=="kill",craft:ev=="craft",barn:ev=="barn"}[q.type]);
function genQuest(taken){
  const pool=QUEST_POOL.filter(e=>!e.ok||e.ok()),tot=pool.reduce((a,e)=>a+e.w,0);
  for(let tr=0;tr<30;tr++){
    let x=Math.random()*tot,e=pool[0];for(const c of pool){if((x-=c.w)<0){e=c;break}}
    const q=Object.assign(e.make(),{p:0,cl:0});if(!taken.includes(qKey(q)))return q;
  }
  return Object.assign(pool[0].make(),{p:0,cl:0});
}
const dayKey=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function newDay(){S.q={d:dayKey(),rr:1,list:[]};for(let i=0;i<3;i++)S.q.list.push(genQuest(S.q.list.map(qKey)))}
function ensureQuests(){if(!S.q||S.q.d!==dayKey()||!Array.isArray(S.q.list)||S.q.list.length!=3||!S.q.list.every(qValid)){newDay();say("📜 มีเควสต์ประจำวันใหม่แล้ว!");save()}}

/* track(): single entry point called from the harvest / monster-kill / craft code. Updates lifetime stats + today's quests. */
function track(ev,d){
  if(!S.q)ensureQuests();
  const st=S.stats,n=ev=="kill"?1:d.n;
  if(ev=="harvest"){st.h+=n;st.hc[d.k]=(st.hc[d.k]||0)+n;if(d.rar>=1)st.hg+=n;if(d.rar>=2)st.hr+=n}
  else if(ev=="kill"){st.k++;st.kc[d.ty]=(st.kc[d.ty]||0)+1}
  else if(ev=="craft")st.cr+=n;
  else if(ev=="barn")st.an+=n;
  S.q.list.forEach(q=>{
    if(q.cl||q.p>=q.need||!qMatch(q,ev,d))return;
    q.p=Math.min(q.need,q.p+n);
    if(q.p>=q.need){flo(240,170,"📜 เควสต์สำเร็จ!","#7dffb0");say("📜 เควสต์สำเร็จ: "+qText(q)+" • กดรับรางวัลที่เมนู Quests");SFX.coin()}
  });
}

function giveReward(rw){rw.forEach(([k,q])=>{if(k=="z")S.z+=q;else add(k,q)})}

}

/* ===== [PATCH 1.1] MODULE 4: Crafting & Cooking =====
   Add a recipe = add one object to RECIPES.
   id, cat ("craft"|"cook"), ic, lv (optional min level), out:[itemKey, qty], ing:[[inventoryKey, qty], ...]
   Ingredient keys are inventory keys: drops ("jelopy","apple","clover"...) or crops "c_<cropIndex>" (c_ = normal quality only,
   so Golden/Rainbow crops are never consumed by accident). Output must exist in DROPS. */
const RECIPES=[
 {id:"mpotion",cat:"craft",ic:"🧪",out:["mpotion",1],ing:[["jelopy",2],["c_1",1]]},            // Jelopy x2 + Red Herb      -> Minor Potion
 {id:"fert",cat:"craft",ic:"🌱",out:["fert",1],ing:[["jelopy",3],["c_0",2]]},                    // Jelopy x3 + Poring x2     -> Fertilizer (-50% growth time)
 {id:"brew",cat:"craft",ic:"💪",lv:4,out:["brew",1],ing:[["jelopy",3],["c_1",2]]},               // Jelopy x3 + Red Herb x2   -> Berserk Brew (buff)
 {id:"stew",cat:"cook",ic:"🍲",lv:3,out:["stew",1],ing:[["jelopy",2],["apple",1],["c_2",1]]},     // Jelopy x2 + Apple + Yellow Herb -> Herbal Stew (buff)
 {id:"omelet",cat:"cook",ic:"🍳",lv:3,out:["omelet",1],ing:[["egg",2],["c_1",1]]},                     // Egg x2 + Red Herb          -> Herb Omelet (+80 Energy)
 {id:"soup",cat:"cook",ic:"🥛",lv:6,out:["soup",1],ing:[["milk",1],["egg",1],["c_2",1]]},          // Milk + Egg + Yellow Herb   -> Hearty Soup (EXP +50%)
 {id:"scarf",cat:"craft",ic:"🧣",lv:8,out:["scarf",1],ing:[["wool",2],["jelopy",2]]},              // Wool x2 + Jelopy x2        -> Wool Scarf (Energy regen x2)
 {id:"tea",cat:"cook",ic:"🍵",lv:5,out:["tea",1],ing:[["jelopy",2],["clover",1]]}];              // Jelopy x2 + Clover        -> Lucky Tea (buff)
const RCAT={craft:"⚗ Crafting",cook:"🍳 Cooking"};
const craftMax=r=>Math.min(99,...r.ing.map(([k,q])=>Math.floor((S.inv[k]||0)/q)));
function craft(id,n){
  const r=RECIPES.find(x=>x.id==id);if(!r||S.lv<(r.lv||0))return;
  n=Math.min(n,craftMax(r));if(n<1){SFX.bad();return}
  r.ing.forEach(([k,q])=>add(k,-q*n));add(r.out[0],r.out[1]*n);       // deduct ingredients, add product
  track("craft",{n});SFX.craft();flo(240,240,"+"+DROPS[r.out[0]].n+" x"+r.out[1]*n,"#b8f0ff");save();craftUI();
}
function recipeRow(r){
  const [ok,oq]=r.out,o=DROPS[ok],mx=craftMax(r),lock=S.lv<(r.lv||0);
  const ing=r.ing.map(([k,q])=>{const h=S.inv[k]||0;return `<small style="color:${h>=q?"#1f7a3a":"#c0182b"}">${nm2(k)} ${h}/${q}</small>`}).join(" + ");
  return `<div class="row" style="${lock?"opacity:.6":""}"><span style="flex:1">${r.ic} <b>${o.n}</b>${oq>1?" x"+oq:""}<br><small>${o.d}</small><br>${ing}</span>
  <span style="display:flex;flex-direction:column;gap:3px">${lock?`<button disabled>🔒 Lv ${r.lv}</button>`:`<button ${mx?"":"disabled"} onclick="craft('${r.id}',1)">Craft</button>`+(mx>1?`<button onclick="craft('${r.id}',${mx})">Max ×${mx}</button>`:"")}</span></div>`;
}
function craftUI(){
  modal("<h3>⚗ Craft & Cook</h3>"+Object.keys(RCAT).map(c=>`<b>${RCAT[c]}</b>`+RECIPES.filter(r=>r.cat==c).map(recipeRow).join("")).join("")+
   `<div style="font-size:12px;text-align:center;margin-top:6px">ใช้ผลผลิตแบบธรรมดาเท่านั้น (Golden/Rainbow จะไม่ถูกใช้) • ของที่ได้ใช้ได้จากเมนู Inventory</div>`);
}

/* ===== [PATCH 1.7] MODULE 5: Gardeners (up to 5 auto-farm workers, 2.5 minutes each) =====
   Each Gardener Contract hires ONE gardener for GARDENER_MS (max GARDENER_MAX at once). S.gd = [msLeft, ...] (saved);
   GW = runtime workers {x,y,tg,wk,mv} kept in the same order as S.gd.
   Teamwork: a plot is CLAIMED by the gardener walking to it (tg), so no two gardeners ever go for the same plot, and planting is
   limited to the seeds actually left in the Inventory minus the seeds other gardeners are already about to plant.
   Choosing work: every actionable plot gets score = distance - priority*45 (harvest 4 > water 3 > plant 2 > hoe 1), lowest score wins,
   so each gardener takes the closest useful job and the team naturally spreads over the field.
   Tasks per plot: hoe -> plant (selected seed, else best seed in the bag) -> water -> harvest (normal rules: rarity, double, EXP, quests).
   No Energy cost; seeds are taken from the Inventory. */
const GARDENER_MS=150000, GARDENER_MAX=5, GARDENER_WORK=260, GARDENER_SPEED=.22;
const GW=[], GHAT=["#c23b2b","#2f7bff","#9a5cd8","#e69a00","#1f9a6a"];
let gdWarn=0;
const gdSay=m=>{if(Date.now()-gdWarn>8000){gdWarn=Date.now();say(m)}};
const gdRest=i=>({x:30+i*26,y:68});
FX.gardener=()=>{
  if(S.gd.length>=GARDENER_MAX){say("🧑‍🌾 มีชาวสวนครบ "+GARDENER_MAX+" คนแล้ว รอให้คนใดคนหนึ่งเลิกงานก่อน");return false}
  S.gd.push(GARDENER_MS);flo(240,200,"🧑‍🌾 ชาวสวนคนที่ "+S.gd.length+" มาแล้ว!","#7dffb0");say("🧑‍🌾 จ้างชาวสวนแล้ว "+S.gd.length+"/"+GARDENER_MAX+" คน (คนละ 2:30 นาที)");return true;
};
const seedsTotal=()=>CROPS.reduce((a,c,i)=>a+(S.inv["s_"+i]||0),0);
function gSeed(){ // seeds ALWAYS come from the Inventory (S.inv["s_<id>"]): selected seed first, otherwise the most valuable seed still in the bag
  if(S.inv["s_"+S.seed]>0)return S.seed;
  let b=-1;CROPS.forEach((c,i)=>{if(S.inv["s_"+i]>0&&(b<0||c.sell>CROPS[b].sell))b=i});return b;
}
function gNeed(i){ // what does plot i need right now? 0 nothing, 1 hoe, 2 plant, 3 water, 4 harvest
  const t=S.tiles[i];if(!t)return 0;
  if(t.st==2)return !t.w?3:t.g>=need(t.k)?4:0;
  if(t.st==1)return gSeed()>=0?2:0;
  return t.st==0?1:0;
}
function gAct(i){ // does the job on plot i; returns true if something was done
  const t=S.tiles[i],cx=tcx(i),cy=tcy(i);if(!t)return false;
  if(t.st==0){t.st=1;flo(cx,cy,"พรวนดิน","#e8c28a");return true}
  if(t.st==1){
    const k=gSeed();if(k<0){gdSay("🧑‍🌾 ชาวสวน: เมล็ดใน Inventory หมด! ซื้อที่ Kafra Shop");return false}
    if(k!==S.seed)gdSay("🧑‍🌾 เมล็ดที่เลือกหมด ใช้ "+CROPS[k].n+" จาก Inventory แทน");
    add("s_"+k,-1);Object.assign(t,{st:2,k,g:0,w:!!(has("well")&&Math.random()<.3),rar:rollRar(),f:0});refreshSeeds();flo(cx,cy,"🌱 เหลือ "+(S.inv["s_"+k]||0),"#9dff7a");return true;
  }
  if(t.st==2){
    if(!t.w){t.w=true;flo(cx,cy,"💧","#9cf");return true}
    if(t.g>=need(t.k)){
      const n=1+(Math.random()<S.str*.04+SE().dbl?1:0),rr=t.rar||0,rk="cgr"[rr],c=CROPS[t.k];
      add(rk+"_"+t.k,n);track("harvest",{k:t.k,rar:rr,n});
      flo(cx,cy,rr?(rr==2?"🌈RAINBOW!":"✨GOLDEN!"):"+"+n+(n>1?" DOUBLE!":""),rr==2?"#ff7bff":rr?"#ffd700":"#fff");
      gainExp(Math.round(c.exp*CR[rk].e*n),cx,cy+14);beep(880,.06,"square",0,0,.03);
      t.st=1;delete t.k;delete t.f;return true;
    }
  }
  return false;
}
function gPick(w,idx){ // choose the best unclaimed plot for gardener idx (or -1)
  const claimed=new Set();let planting=0;
  GW.forEach((o,j)=>{if(j!==idx&&o.tg>=0){claimed.add(o.tg);if(S.tiles[o.tg]&&S.tiles[o.tg].st==1)planting++}});
  const seeds=seedsTotal()-planting;let best=-1,bs=1e9,blocked=false;
  for(let i=0;i<S.tiles.length;i++){
    if(claimed.has(i))continue;const p=gNeed(i);
    if(!p){if(S.tiles[i].st==1&&gSeed()<0)blocked=true;continue}
    if(p==2&&seeds<=0){blocked=true;continue}
    const sc=Math.hypot(tcx(i)-w.x,tcy(i)-w.y)-p*45;if(sc<bs){bs=sc;best=i}
  }
  if(best<0&&blocked)gdSay("🧑‍🌾 ชาวสวน: เมล็ดใน Inventory หมด! ซื้อที่ Kafra Shop");
  return best;
}
function tickGardener(dt){
  if(!S.gd.length){GW.length=0;return}
  while(GW.length<S.gd.length){const r=gdRest(GW.length);GW.push({x:r.x,y:r.y,tg:-1,wk:0,mv:false})}
  GW.length=S.gd.length;
  for(let i=S.gd.length-1;i>=0;i--)if((S.gd[i]-=dt)<=0){S.gd.splice(i,1);GW.splice(i,1);say("🧑‍🌾 ชาวสวนคนหนึ่งเลิกงานแล้ว (เหลือ "+S.gd.length+" คน)");save()}
  GW.forEach((w,i)=>{
    w.mv=false;
    if(w.tg>=S.tiles.length)w.tg=-1;
    if(w.wk>0){ // working on the plot
      if((w.wk-=dt)<=0){w.wk=0;if(w.tg>=0)gAct(w.tg);w.tg=-1}
      return;
    }
    if(w.tg<0)w.tg=gPick(w,i);
    if(w.tg>=0&&!gNeed(w.tg))w.tg=-1;                     // job disappeared (crop eaten, etc.)
    const tx=w.tg>=0?tcx(w.tg)+10:gdRest(i).x,ty=w.tg>=0?tcy(w.tg)+16:gdRest(i).y,d=Math.hypot(tx-w.x,ty-w.y);
    if(d>4){const st=Math.min(d,dt*GARDENER_SPEED);w.x+=(tx-w.x)/d*st;w.y+=(ty-w.y)/d*st;w.mv=true}
    else if(w.tg>=0)w.wk=GARDENER_WORK;
  });
  if(Math.random()<dt/2500)save();
}
function drawGardener(now){
  GW.map((w,i)=>({w,i})).sort((a,b)=>a.w.y-b.w.y).forEach(({w,i})=>{
    const b=w.mv?Math.abs(Math.sin(now/90+i))*3:w.wk>0?Math.abs(Math.sin(now/70))*2:Math.sin(now/300+i)*1,x=w.x,y=w.y-b,sh=GHAT[i%GHAT.length];
    ell(x,w.y+13,10,3,"#0003");rect(x-6,y-8,12,16,"#4a8a3a");rect(x-6,y+2,12,3,"#7a4a21");
    rect(x-8,y-6,3,10,"#ffd7b0");rect(x+5,y-6,3,10,"#ffd7b0");ell(x,y-13,6,6,"#ffd7b0");
    ell(x,y-17,13,4,"#e8c860");ell(x,y-20,6,5,"#e8c860");rect(x-6,y-18,12,2,sh);
    g.fillStyle="#222";g.fillRect(x-3,y-13,2,2);g.fillRect(x+1,y-13,2,2);
    rect(x+9,y-14,2,26,"#8b5a2b");rect(x+6,y+10,8,2,"#aaa");
  });
}

/* ===== [PATCH 1.8] MODULE 6: Golems (up to 5 auto-fighters, 2.5 minutes each) =====
   Same idea as the gardeners: each Golem Contract hires ONE golem (max GOLEM_MAX at once). S.gl = [msLeft,...] (saved),
   GL = runtime workers {x,y,tg,cd,sw,mv}. Each golem picks a monster, walks to it and hits it every GOLEM_HIT ms (no Energy cost).
   Teamwork: monsters already being chased by a golem are avoided (at most 2 golems per monster, only when there are fewer monsters than golems),
   and monsters that are eating a crop are hunted first. Kills go through die(), so Zeny / EXP / drops / Gacha Coins / quests all work. */
const GOLEM_MS=150000, GOLEM_MAX=5, GOLEM_SPEED=.2, GOLEM_HIT=700, GOLEM_RANGE=24;
const GL=[];
const glRest=i=>({x:90+i*30,y:464});
FX.golem=()=>{
  if(S.gl.length>=GOLEM_MAX){say("🗿 มีโกเลมครบ "+GOLEM_MAX+" ตัวแล้ว รอให้ตัวใดตัวหนึ่งหมดเวลาก่อน");return false}
  S.gl.push(GOLEM_MS);flo(240,200,"🗿 โกเลมตัวที่ "+S.gl.length+" มาแล้ว!","#7dffb0");say("🗿 จ้างโกเลมแล้ว "+S.gl.length+"/"+GOLEM_MAX+" ตัว (ตัวละ 2:30 นาที)");return true;
};
function glHit(m){ // same damage formula as attack(), but free of Energy
  const dmg=Math.round((6+S.str*2+(Math.random()*4|0))*(1+.25*has("dummy"))*SE().dmg);
  m.hp-=dmg;m.hit=150;beep(260,.05,"sawtooth",80,0,.03);flo(m.x,m.y-26,"-"+dmg,"#d8ffd8");
  if(m.hp<=0)die(m);
}
function glPick(w,idx){
  const cnt=new Map();GL.forEach((o,j)=>{if(j!==idx&&o.tg)cnt.set(o.tg,(cnt.get(o.tg)||0)+1)});
  let best=null,bs=1e9;
  mons.forEach(m=>{
    const c=cnt.get(m)||0;if(c>=2)return;
    const sc=Math.hypot(m.x-w.x,m.y-w.y)-(m.eat>0?150:0)+c*400;if(sc<bs){bs=sc;best=m}
  });
  return best;
}
function tickGolem(dt){
  if(!S.gl.length){GL.length=0;return}
  while(GL.length<S.gl.length){const r=glRest(GL.length);GL.push({x:r.x,y:r.y,tg:null,cd:0,sw:0,mv:false})}
  GL.length=S.gl.length;
  for(let i=S.gl.length-1;i>=0;i--)if((S.gl[i]-=dt)<=0){S.gl.splice(i,1);GL.splice(i,1);say("🗿 โกเลมตัวหนึ่งหมดเวลาแล้ว (เหลือ "+S.gl.length+" ตัว)");save()}
  GL.forEach((w,i)=>{
    w.mv=false;w.cd=Math.max(0,w.cd-dt);w.sw=Math.max(0,w.sw-dt);
    if(w.tg&&!mons.includes(w.tg))w.tg=null;
    if(!w.tg)w.tg=glPick(w,i);
    let tx,ty;if(w.tg){tx=w.tg.x;ty=w.tg.y}else{const r=glRest(i);tx=r.x;ty=r.y}
    const d=Math.hypot(tx-w.x,ty-w.y);
    if(w.tg&&d<=GOLEM_RANGE){if(w.cd<=0){w.cd=GOLEM_HIT;w.sw=260;glHit(w.tg)}}
    else if(d>4){const st=Math.min(d,dt*GOLEM_SPEED);w.x+=(tx-w.x)/d*st;w.y+=(ty-w.y)/d*st;w.mv=true}
  });
  if(Math.random()<dt/2500)save();
}
function drawGolem(now){
  GL.map((w,i)=>({w,i})).sort((a,b)=>a.w.y-b.w.y).forEach(({w,i})=>{
    const b=w.mv?Math.abs(Math.sin(now/110+i))*3:0,x=w.x,y=w.y-b,sw=w.sw>0?Math.sin(w.sw/260*Math.PI)*10:0;

/* ===== [PATCH 1.9] MODULE 7: Barn (animals) =====
   S.barn = {c: tier index, a: [{k: animal id, p: ms of progress, f: feed charges, o: products waiting}]}.
   Feed an animal with crops from the Inventory (normal quality) -> while it has feed charges it makes one product per `cycle` ms
   (speed follows the season / event growth modifier). Products wait in the barn (max BARN_STORE each) until you Collect them. */
const barnCap=()=>BARN_TIERS[S.barn.c].cap;
const barnReady=()=>S.barn.a.reduce((t,a)=>t+a.o,0);
const feedMax=(a,want)=>Math.min(want,BARN_FEED_MAX-a.f,...ANIMALS[a.k].feed.map(([k,q])=>Math.floor((S.inv[k]||0)/q)));
function tickBarn(dt){
  let made=0;
  S.barn.a.forEach(a=>{
    const d=ANIMALS[a.k];if(a.f<=0||a.o>=BARN_STORE)return;
    a.p+=dt*SE().grow;
    while(a.p>=d.cycle&&a.f>0&&a.o<BARN_STORE){a.p-=d.cycle;a.f--;a.o++;made++}
    if(a.f<=0||a.o>=BARN_STORE)a.p=Math.min(a.p,d.cycle*.999); // idle animals keep their partial progress, never an overflow
  });
  if(made){SFX.coin();flo(459,70,"🐔 +"+made,"#ffe36a");save()}
}
function buyAnimal(k){
  const d=ANIMALS[k],c=P(d.cost);
  if(!d||S.lv<d.lv||S.z<c||S.barn.a.length>=barnCap()){SFX.bad();return}
  S.z-=c;S.barn.a.push({k,p:0,f:0,o:0});SFX.lvl();flo(240,210,d.ic+" "+d.n+"!","#7dffb0");save();barnUI();
}
function upgradeBarn(){
  const u=BARN_TIERS[S.barn.c+1];if(!u||S.lv<u.lv||S.z<P(u.cost)){SFX.bad();return}
  S.z-=P(u.cost);S.barn.c++;SFX.lvl();flo(240,210,"🏚 Barn "+u.cap+" ตัว!","#7dffb0");save();barnUI();
}
function feedAnimal(i,n){
  const a=S.barn.a[i];if(!a)return;const m=feedMax(a,n);if(m<1){SFX.bad();say("🐔 ไม่มีอาหารใน Inventory หรืออิ่มเต็มแล้ว");return}
  ANIMALS[a.k].feed.forEach(([k,q])=>add(k,-q*m));a.f+=m;SFX.plant();save();barnUI();
}
function feedAll(){
  let tot=0;S.barn.a.forEach(a=>{const m=feedMax(a,BARN_FEED_MAX);if(m>0){ANIMALS[a.k].feed.forEach(([k,q])=>add(k,-q*m));a.f+=m;tot+=m}});
  if(!tot){SFX.bad();say("🐔 ไม่มีอาหารใน Inventory หรืออิ่มเต็มแล้ว")}else{SFX.plant();say("🌾 ให้อาหารสัตว์รวม "+tot+" มื้อ")}save();barnUI();
}
function collect(list){
  let n=0;list.forEach(a=>{if(a.o>0){add(ANIMALS[a.k].out,a.o);n+=a.o;a.o=0}});
  if(!n){SFX.bad();return}track("barn",{n});SFX.harvest();flo(240,230,"🧺 +"+n+" ผลผลิตจากคอก","#ffe36a");save();barnUI();
}

}

/* =====================================================================================================
   [PATCH 1.4]  STABILITY + ADMIN SYSTEM v3  (admin is hidden from normal players)
   Open:   tap the "Lv" label 7 times quickly (or Alt+Shift+A on desktop) -> enter the passcode.
   Stability (1.4): game loop survives a bad frame, saves are locked while reloading, backups are verified (3 auto + 1 manual),
           imports are fully validated, unreadable saves are kept for recovery, Admin > Data has Diagnose/Repair + error log.
   Safety: admin state is never saved, auto-logout after 15 min idle, 5 wrong passcodes lock login for 5 min (survives reload),
           every change is preceded by an automatic backup, destructive buttons need a second press to confirm.
   Passcode: run  adminHash("new passcode")  in the browser console and paste the number into ADMIN_HASH.
   NOTE: this is a client-side game - it keeps casual players out, it cannot stop someone who edits the page or localStorage.
   Add a tool: add one function to ADMCMD (return a message string, or throw Error("reason") for bad input),
               then add a button in adminUI() with  B(label, "command", argOrUndefined, "inputIdsToRead").
   ===================================================================================================== */
const ADMIN_HASH=903635439638604;                       // hash of the default passcode "RMR-Admin-1.2"  <- CHANGE BEFORE RELEASE
const ADMIN_IDLE_MS=15*60*1000, ADMIN_LOCK_MS=5*60*1000, ADMIN_MAX_FAILS=5, ADM_CONFIRM_MIN=500, ADM_BAK_KEEP=3;
let ADM_RELOAD_MS=8000;
const ADM_LOCKK="rmr_adm_lock", ADM_EPOCHK="rmr_admin_epoch", ADM_BAK={man:"rmr_admin_bak_man",auto:"rmr_admin_bak_auto"};
function adminHash(str,seed=0){                          // cyrb53 string hash (not cryptographic; keeps the passcode out of plain sight)
  let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;
  for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
/* ---- [PATCH 1.4] error log + reload lock + cross-tab sync ---- */
const ERRLOG=[];let errN=0;
function noteErr(src,e){ // called by the frame guard, window.onerror and the admin panel; never throws
  try{
    errN++;const m=(e&&e.message)||String(e),l=ERRLOG[0];
    if(l&&l.src==src&&l.m==m){l.n++;l.t=Date.now()}else{ERRLOG.unshift({t:Date.now(),src,m,n:1});ERRLOG.length=Math.min(ERRLOG.length,10)}
    if(errN<=3||errN%200==0)console.error("["+src+"]",e);
    if(errN==5)say("⚠ เกิดข้อผิดพลาดซ้ำ ลองรีโหลดหน้า (แอดมินดูรายละเอียดได้)");
  }catch(_){}
}
/* admReload(write): lock saving, run write() (localStorage change), tell other tabs, reload. If the reload never happens, unlock again. */
function admReload(write){
  SAVE_LOCK=true;removeEventListener("beforeunload",saveNow);
  try{if(write){write();lsSet(ADM_EPOCHK,Date.now())}location.reload()}catch(e){SAVE_LOCK=false;addEventListener("beforeunload",saveNow);throw e}
  setTimeout(()=>{SAVE_LOCK=false;addEventListener("beforeunload",saveNow);say("⚠ รีโหลดหน้าไม่สำเร็จ — กดรีเฟรชเอง (ปลดล็อกการบันทึกแล้ว)");if(ADMIN){admNote("✗ รีโหลดหน้าไม่สำเร็จ — กดรีเฟรชเอง",0);adminUI()}},ADM_RELOAD_MS);
}
function stabilityInit(){
  addEventListener("error",ev=>noteErr("window",ev.error||ev.message));
  addEventListener("unhandledrejection",ev=>noteErr("promise",ev.reason));
  document.addEventListener("visibilitychange",()=>{if(document.hidden)saveNow()}); // mobile browsers often skip beforeunload
  addEventListener("pagehide",saveNow);
  addEventListener("storage",e=>{if(e.key===ADM_EPOCHK&&e.newValue&&!SAVE_LOCK)admReload(null)}); // another tab changed the save via Admin -> reload, never overwrite it
}

/* ---- small helpers ---- */
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const lsSetOk=(k,v)=>{try{const t=JSON.stringify(v);localStorage.setItem(k,t);return localStorage.getItem(k)===t}catch(e){return false}}; // write + read back
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const num=(v,min,max)=>{const n=Math.trunc(Number(v));if(v===""||v==null||!Number.isFinite(n))throw new Error("ตัวเลขไม่ถูกต้อง");return Math.max(min,Math.min(max,n))};
const allKeys=()=>[...CROPS.flatMap((c,i)=>["s_","c_","g_","r_"].map(p=>p+i)),...Object.keys(DROPS)]; // every valid inventory key
/* ---- session state (in memory only) ---- */
let admTab="p",admLast=0,admArm={c:"",t:0},admMsg={t:0,m:"",ok:1},admIn={},admExp="",admLog=[],admBacked=false,admTaps=0,admT=0,admTimer=0;
const admNote=(m,ok)=>{admMsg={t:Date.now(),m,ok}};
const logA=m=>{admLog.unshift(new Date().toTimeString().slice(0,8)+" "+m);admLog.length=Math.min(admLog.length,30)};
const bakList=()=>{const m=lsGet(ADM_BAK.man,null),a=lsGet(ADM_BAK.auto,[]);return {man:m&&m.s?m:null,auto:(Array.isArray(a)?a:[a]).filter(b=>b&&b.s)}};
function admBackup(slot,why){ // throws if the backup could not be stored AND read back -> the command that needed it is cancelled
  const e={t:Date.now(),why,s:JSON.stringify(S)},fail=()=>{throw new Error("สำรองเซฟไม่สำเร็จ (พื้นที่เก็บข้อมูลเต็ม?) — ยกเลิกคำสั่ง")};
  if(slot=="man"){if(!lsSetOk(ADM_BAK.man,e))fail();return}
  const a=bakList().auto;a.unshift(e);a.length=Math.min(a.length,ADM_BAK_KEEP);
  if(!lsSetOk(ADM_BAK.auto,a)){a.length=1;if(!lsSetOk(ADM_BAK.auto,a))fail()}   // low on space: keep only the newest
}

/* validateSave(): full structural check so an imported/restored save can never brick the game */
function validateSave(o){
  const bad=m=>{throw new Error("ไฟล์เซฟไม่ถูกต้อง: "+m)};
  if(!o||typeof o!="object"||Array.isArray(o))bad("ต้องเป็น object");
  for(const k of ["z","exp","lv","en"])if(!Number.isFinite(o[k])||o[k]<0)bad(k);
  for(const k of ["str","dex","luk","pt"])if(o[k]!==undefined&&(!Number.isFinite(o[k])||o[k]<0))bad(k);
  if(o.lv<1||o.lv>999)bad("lv");
  if(!Array.isArray(o.tiles)||!o.tiles.length)bad("tiles");
  const n=Math.sqrt(o.tiles.length);if(!Number.isInteger(n)||n>12)bad("จำนวนแปลงต้องเป็นกำลังสอง (1×1–12×12)");
  if(o.gs!==undefined&&o.gs!==n)bad("gs ไม่ตรงกับจำนวนแปลง");
  o.tiles.forEach((t,i)=>{if(!t||typeof t!="object"||![0,1,2].includes(t.st))bad("แปลง "+i);if(t.st==2&&!(Number.isInteger(t.k)&&t.k>=0&&t.k<CROPS.length&&Number.isFinite(t.g)))bad("พืชในแปลง "+i)});
  if(!o.inv||typeof o.inv!="object"||Array.isArray(o.inv))bad("inv");
  const keys=new Set(allKeys());for(const k in o.inv){if(!keys.has(k))bad("ไอเทมที่ไม่รู้จัก "+k);if(!Number.isFinite(o.inv[k])||o.inv[k]<=0)bad("จำนวนไอเทม "+k)}
  return o;
}
function parseSave(a){
  if(typeof a!="string"||a.length>2e6)throw new Error("ข้อความว่างหรือใหญ่เกินไป");
  let o;try{o=JSON.parse(a)}catch(e){throw new Error("JSON ไม่ถูกต้อง")}
  return validateSave(o);
}
function getBak(a){ // a = "man" | "a0".."a2"
  const L=bakList(),b=a=="man"?L.man:L.auto[+String(a).slice(1)];if(!b)throw new Error("ยังไม่มี backup นี้");
  let o;try{o=JSON.parse(b.s)}catch(e){throw new Error("backup เสียหาย")}validateSave(o);return b;
}
const PRECHECK={import:parseSave,restore:getBak};                  // bad input is rejected immediately, before asking to confirm

/* ---- diagnose / repair: the same checks the game relies on, with an automatic fix for each ---- */
let admDiag=[];
function checkState(){
  const P=[],add=(m,fix)=>P.push({m,fix});
  const nz=(k,min,def)=>{if(!Number.isFinite(S[k])||S[k]<min)add(k+" ผิดปกติ ("+S[k]+")",()=>{S[k]=def})};
  nz("z",0,0);nz("exp",0,0);nz("pt",0,0);nz("lv",1,1);nz("str",1,1);nz("dex",1,1);nz("luk",1,1);
  if(!Number.isFinite(S.en)||S.en<0||S.en>maxEn()+1)add("Energy ผิดปกติ ("+S.en+")",()=>{S.en=Math.min(Math.max(Number.isFinite(S.en)?S.en:maxEn(),0),maxEn())});
  const n=S.gs,len=S.tiles.length;
  if(!Number.isInteger(n)||n<1||n>12||len!=n*n)add("จำนวนแปลง ("+len+") ไม่ตรงกับขนาดฟาร์ม ("+n+"×"+n+")",()=>{
    const ow=Math.max(1,Math.round(Math.sqrt(len))),nn=Number.isInteger(n)&&n>=1&&n<=12?n:Math.min(12,Math.max(GRID.start,ow));
    const nt=Array.from({length:nn*nn},()=>({st:0}));S.tiles.forEach((t,i)=>{const r=i/ow|0,c=i%ow;if(r<nn&&c<nn)nt[r*nn+c]=t});
    S.tiles=nt;S.gs=nn;setGrid(nn);mons.forEach(m=>{m.tg=-1})});
  else if(N!==n)add("ขนาดกริดที่แสดง (N="+N+") ไม่ตรงกับเซฟ ("+n+")",()=>setGrid(n));
  const badT=[];S.tiles.forEach((t,i)=>{if(!t||typeof t!="object"||![0,1,2].includes(t.st)||(t.st==2&&(!Number.isInteger(t.k)||t.k<0||t.k>=CROPS.length||!Number.isFinite(t.g))))badT.push(i)});
  if(badT.length)add("แปลงเสีย "+badT.length+" แปลง",()=>badT.forEach(i=>{const t=S.tiles[i];S.tiles[i]=t&&typeof t=="object"&&t.st==2?{st:1}:{st:0}}));
  const keys=new Set(allKeys()),badI=Object.keys(S.inv).filter(k=>!keys.has(k)||!Number.isFinite(S.inv[k])||S.inv[k]<=0);
  if(badI.length)add("ไอเทมผิดปกติ: "+badI.slice(0,4).join(", ")+(badI.length>4?"…":""),()=>badI.forEach(k=>{delete S.inv[k]}));
  const badB=Object.keys(S.bf).filter(k=>!BUFFS[k]||!Number.isFinite(S.bf[k]));
  if(badB.length)add("บัฟผิดปกติ: "+badB.join(", "),()=>{badB.forEach(k=>{delete S.bf[k]});rebuildSE()});
  if(!Array.isArray(S.gd)||S.gd.length>GARDENER_MAX||S.gd.some(v=>!Number.isFinite(v)))add("ข้อมูลชาวสวนผิดปกติ",()=>{S.gd=(Array.isArray(S.gd)?S.gd:[]).filter(Number.isFinite).slice(0,GARDENER_MAX)});
  if(!Array.isArray(S.gl)||S.gl.length>GOLEM_MAX||S.gl.some(v=>!Number.isFinite(v)))add("ข้อมูลโกเลมผิดปกติ",()=>{S.gl=(Array.isArray(S.gl)?S.gl:[]).filter(Number.isFinite).slice(0,GOLEM_MAX)});
  if(!S.barn||!Array.isArray(S.barn.a)||S.barn.a.some(x=>!x||!ANIMALS[x.k]||!Number.isFinite(x.p)||!(x.f>=0&&x.f<=BARN_FEED_MAX)||!(x.o>=0&&x.o<=BARN_STORE))||S.barn.a.length>barnCap())add("ข้อมูลคอกสัตว์ผิดปกติ",()=>{S.barn=normBarn(S.barn)});
  if(S.ev&&!EVENTS[S.ev.id])add("อีเวนต์ที่ไม่รู้จัก ("+S.ev.id+")",()=>{S.ev=null;rebuildSE()});
  if(!S.q||!Array.isArray(S.q.list)||S.q.list.length!=3||!S.q.list.every(qValid))add("เควสต์ประจำวันผิดปกติ",()=>newDay());
  const badM=mons.filter(x=>x.tg>=S.tiles.length||x.tg<-1||!Number.isFinite(x.x)||!Number.isFinite(x.y)||!MON[x.ty]);
  if(badM.length)add("มอนสเตอร์ผิดปกติ "+badM.length+" ตัว",()=>{for(let i=mons.length-1;i>=0;i--)if(badM.includes(mons[i]))mons.splice(i,1)});
  return P;
}

/* adm(): the ONLY entry point for admin actions. Refused without an admin session; errors are shown, never thrown. */
function adm(c,a){
  if(!ADMIN)return;
  admLast=Date.now();admSaveInputs();
  try{
    const fn=ADMCMD[c];if(!fn)throw new Error("คำสั่งไม่ถูกต้อง: "+c);
    if(PRECHECK[c])PRECHECK[c](a);
    if(DANGER.has(c)){
      const dt=Date.now()-admArm.t;
      if(admArm.c!=c||dt>=4000){admArm={c,t:Date.now()};admNote("⚠ กดปุ่มเดิมอีกครั้ง (ภายใน 4 วินาที) เพื่อยืนยัน",0);adminUI();return}
      if(dt<ADM_CONFIRM_MIN)return;                                 // a double-click must not confirm by accident
    }
    admArm={c:"",t:0};
    if(!ADMRO.has(c)){                                              // safety net: snapshot before changing anything
      if(DANGER.has(c)){if(c!="restore")admBackup("auto","ก่อน "+c)}
      else if(!admBacked)admBackup("auto","เริ่มเซสชัน");
      admBacked=true;
    }
    const m=fn(a);
    if(m){admNote("✓ "+m,1);if(!ADMRO.has(c)||c=="export")logA(m)}
    if(RELOAD.has(c))return;
    if(!ADMRO.has(c))save();
  }catch(err){admNote("✗ "+err.message,0);logA("ERR "+c+": "+err.message);console.warn("[admin]",c,err)}
  if(ADMIN)adminUI(c=="tab");
}

  adm(b.dataset.adm,a);
}

  const msg=admMsg.m&&Date.now()-admMsg.t<8000?`<div style="font-size:12px;margin:2px 0 4px;color:${admMsg.ok?"#1f7a3a":"#c0182b"}">${esc(admMsg.m)}</div>`:"";
  let h=`<h3>🛠 Admin</h3><div id="admStat" style="font-size:12px;background:#fff8;border-radius:6px;padding:4px 6px;margin-bottom:4px">${admStatHTML()}</div>`+
   `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px">${ADM_TABS.map(([id,l])=>`<button data-adm="tab" data-a="${id}" class="${admTab==id?"on":""}" style="flex:1 1 22%">${l}</button>`).join("")}</div>`+msg;
  if(admTab=="p"){
    const opts=allKeys().map(k=>`<option value="${k}"${(admIn.admItem||"fert")==k?" selected":""}>${esc(nm2(k))}</option>`).join("");
    h+=H("Zeny")+G(NI("admZ",1000,96)+B("เพิ่ม","z",undefined,"admZ")+B("ตั้งเป็น","setz",undefined,"admZ"))+
     H("เลเวล / แต้ม / Energy")+G(NI("admLv",S.lv,60)+B("ตั้งเลเวล","setlv",undefined,"admLv")+B("+1 Lv","lvup")+B("+10 Stat Pts","pt",10)+B("เติม Energy","en"))+
     H("ให้ / ลบไอเทม (ใส่เลขติดลบเพื่อลบ)")+G(`<select id="admItem" style="flex:2 1 140px;padding:4px">${opts}</select>`+NI("admQty",5,60)+B("ตกลง","give",undefined,"admItem,admQty")+B("+5 ทุกชนิด","giveall"))+
     H("คอกสัตว์")+G(B("🐔 เติมคอกเต็ม","barnfill")+B("🌾 ให้อาหารฟรี","barnfeed")+B("🗑 ลบสัตว์","barnclear"))+H("บัฟ")+G(Object.keys(BUFFS).map(k=>B(BUFFS[k].ic+" "+BUFFS[k].n,"buff",k)).join("")+B("🧑‍🌾 +1 Gardener","gard")+B("🗿 +1 Golem","golem")+B("ล้างบัฟ","nobuff"));
  }else if(admTab=="f"){
    const nx=nextGrid(),sizes=[];for(let n=S.gs+1;n<=12;n++)sizes.push(`<option value="${n}"${(admIn.admSize||S.gs+1)==n?" selected":""}>${n}×${n}</option>`);
    h+=H("ขนาดฟาร์ม ("+S.gs+"×"+S.gs+")")+G(B(nx?"ขั้นถัดไป "+nx.size+"×"+nx.size+" (ฟรี)":"ขั้นถัดไป (ไม่มี)","expand")+(sizes.length?`<select id="admSize" style="padding:4px">${sizes.join("")}</select>`+B("ขยายเป็น","expandto",undefined,"admSize"):""))+
     H("แปลงเพาะปลูก")+G(B("💧 รดน้ำทุกต้น","water")+B("🌳 โตเต็มทุกต้น","grow")+B("⛏ พรวนทุกแปลง","hoe")+B("🗑 ถอนพืชทั้งหมด","clearcrops"))+
     H("เควสต์วันนี้")+S.q.list.map((q,i)=>`<div class="row"><span style="flex:1;font-size:12px">${i+1}. ${qText(q)} <b>${q.p}/${q.need}</b>${q.cl?" ✓รับแล้ว":""}</span>${B("สำเร็จ","qone",i)}${B("เปลี่ยน","qrep",i)}</div>`).join("")+
     G(B("สุ่มใหม่ทั้งหมด","qnew")+B("ทำครบทุกข้อ","qdone")+B("รีเซ็ต Stats/Achv","resetstats"));
  }else if(admTab=="w"){
    h+=H("ฤดูกาล")+G(SEASONS.map((e,i)=>B(e.ic+" "+e.n,"season",i)).join("")+B("+30s","skip",30)+B("+120s","skip",120))+
     H("อีเวนต์")+G(Object.keys(EVENTS).map(k=>{const E=EVENTS[k];return B((E.h?"⚠ ":"")+E.ic+" "+E.n,"ev",k)}).join("")+B("⏹ จบอีเวนต์","endev"))+
     H("มอนสเตอร์")+G(Object.keys(MON).map(k=>B("เสก "+MON[k].n,"mon",k)).join("")+B("ลบทั้งหมด","clearmon"));
  }else{
    const L=bakList(),raw=localStorage.getItem("rmr_save_corrupt");
    const row=(b,a,label)=>`<div class="row"><span style="flex:1;font-size:12px"><b>${label}</b><br>${b?esc(new Date(b.t).toLocaleString()+" • "+b.why):"— ยังไม่มี —"}</span>${b?B("กู้คืน","restore",a):""}</div>`;
    h+=H("🩺 ตรวจสอบสถานะเกม")+G(B("ตรวจสอบ","diag")+(admDiag.length?B("🔧 ซ่อมอัตโนมัติ ("+admDiag.length+")","repair"):""))+
     (admDiag.length?`<div style="font-size:11px;color:#c0182b;margin:-4px 0 8px">${admDiag.map(esc).join("<br>")}</div>`:"")+
     H("สำรอง / กู้คืนเซฟ")+row(L.man,"man","ด้วยมือ")+
     (L.auto.length?L.auto.map((b,i)=>row(b,"a"+i,"อัตโนมัติ "+(i?"#"+(i+1):"(ล่าสุด)"))).join(""):row(null,"a0","อัตโนมัติ"))+
     G(B("💾 สำรองเซฟตอนนี้","backup"))+
     (raw?H("⚠ พบเซฟที่อ่านไม่ได้ (เก็บไว้ตอนเปิดเกม)")+G(B("แสดงข้อความดิบ","corrupt")+B("ลบทิ้ง","dropcorrupt")):"")+
     H("ส่งออก / นำเข้า (JSON)")+G(B("📤 ส่งออก","export"))+
     (admExp?`<textarea id="admExp" readonly rows="3" onclick="this.select()" style="width:100%;box-sizing:border-box;font-size:11px">${esc(admExp)}</textarea>`:"")+
     `<textarea id="admImp" rows="3" placeholder="วาง JSON เซฟที่นี่แล้วกดนำเข้า" style="width:100%;box-sizing:border-box;font-size:11px;margin-top:4px">${I("admImp","")}</textarea>`+
     G(B("📥 นำเข้า","import",undefined,"admImp")+B("🗑 ลบเซฟ / เริ่มใหม่","reset"))+
     H("ข้อผิดพลาดล่าสุด ("+ERRLOG.length+")")+`<div style="font-size:11px;max-height:80px;overflow:auto;background:#fff8;padding:4px;border-radius:6px;margin-bottom:4px">${ERRLOG.length?ERRLOG.map(e=>esc(new Date(e.t).toTimeString().slice(0,8)+" ["+e.src+"] "+e.m+(e.n>1?" ×"+e.n:""))).join("<br>"):"—"}</div>`+G(B("ล้างบันทึก","clearerr"))+
     H("ประวัติคำสั่ง (เซสชันนี้)")+`<div style="font-size:11px;max-height:90px;overflow:auto;background:#fff8;padding:4px;border-radius:6px;margin-bottom:8px">${admLog.length?admLog.map(esc).join("<br>"):"—"}</div>`+
     G(B("🚪 ออกจาก Admin","logout"));
  }
  modal(h+`<div style="font-size:12px;text-align:center;margin-top:6px">ไม่ถูกบันทึกในเซฟ • ออกอัตโนมัติเมื่อไม่ใช้งาน 15 นาที</div>`);
  box.scrollTop=sc;admStartTimer();
}
function adminInit(){
  $("lv").onclick=adminTap;                                        // hidden entry: tap the "Lv" label 7 times
  $("mbox").addEventListener("click",admClick);
  addEventListener("keydown",e=>{if(e.altKey&&e.shiftKey&&e.code=="KeyA"){e.preventDefault();adminOpen()}});
  addEventListener("pointerdown",()=>{if(ADMIN)admLast=Date.now()});  // any activity keeps the session alive
}

/* ===== MODULE: Game Loop (requestAnimationFrame, ~60 FPS) ===== */
let last=performance.now(),saveWarn=0;
function frame(now){try{frameBody(now)}catch(e){noteErr("frame",e)}requestAnimationFrame(frame)} // [PATCH 1.4] one bad frame can no longer freeze the whole game
function frameBody(now){
  const dt=Math.min(100,now-last);last=now;
  S.en=Math.min(maxEn(),S.en+dt/1500*SE().regen);if(S.scare>0)S.scare-=dt;
  S.sx=(S.sx||0)+dt;if(has("mailbox")){S.mt=(S.mt||0)+dt;if(S.mt>=90000){S.mt=0;mail()}}
  const si=seasonIdx();if(si!=curSe){curSe=si;if(S.ev)endEv(true);rebuildSE();const e=SEASONS[si];say(e.ic+" เข้าสู่"+e.n+"! "+e.s);flo(240,210,e.ic+" "+e.n,"#fff");SFX.harvest();payUpkeep()}
  if(flash>0)flash-=dt;
  tickBuffs(dt);tickGardener(dt);tickGolem(dt);tickBarn(dt);tickQuestDay(dt); // [PATCH 1.1]
  if(S.ev){const e=EVENTS[S.ev.id];S.ev.l-=dt;e.tk&&e.tk(dt);if(S.ev.l<=0)endEv()}
  else if((evT-=dt)<=0)startEv(pickEv(si));
  S.tiles.forEach(t=>{if(t.st==2&&t.w&&t.g<need(t.k))t.g=Math.min(need(t.k),t.g+dt*(1+S.dex*.04)*SE().grow*(t.f?2:1))});
  spawnT-=dt;if(spawnT<=0){spawn();spawnT=(10000+Math.random()*12000)*SE().sp}
  mons.forEach(m=>updMon(m,dt));
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.l-=dt;f.y-=dt*.03;if(f.l<=0)floats.splice(i,1)}
  if(msgT>0&&(msgT-=dt)<=0)$("msg").textContent="";
  scene(now);mons.slice().sort((a,b)=>a.y-b.y).forEach(monster);drawGardener(now);drawGolem(now);drawFx(now,dt);drawFloats();ui();
}
if(S.ev&&!EVENTS[S.ev.id])S.ev=null;rebuildSE();initPatch(); // [PATCH 1.1]
markTool();refreshSeeds();say("พรวนดิน → ปลูก → รดน้ำ → รอโต → เก็บเกี่ยว!");
requestAnimationFrame(frame);
</script>
